[build-system]
requires=["setuptools>=75","wheel"]
build-backend="setuptools.build_meta"

[project]
name="ecommerce-rag-support"
version="0.1.0"
description="Production-oriented ecommerce support RAG with LangChain and Qdrant"
requires-python=">=3.11"

[tool.setuptools.packages.find]
where=["src"]

[tool.ruff]
line-length=100
target-version="py311"
